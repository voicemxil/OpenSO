name: Build OpenSO

# Per-push CI: verify the client and server compile + publish on EVERY supported platform — the same
# matrix the release pipeline (release.yml) ships — so cross-platform breakage is caught on every push,
# not just at release time. Uploads the builds as artifacts for manual testing; does NOT cut a release
# (that's release.yml, triggered by a dev-N tag).

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

# A newer push to the same branch obsoletes the in-flight run — cancel it instead of queueing a full
# 7-job matrix behind it. Per-push CI only; release.yml must NEVER cancel (a release build is precious).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Verification gate. Runs the automated tests that pin the regression-prone behaviours added by prior
  # work — platform-aware update refusal (non-Windows RIDs never get the win-x64 payload), truthful
  # registration email delivery (a failed send never reports success), duplicate-token prevention (the
  # UNIQUE index + retry loop), and the per-RID client manifest generator. Runs on ubuntu with no game
  # content and no MySQL — the DB tests use a throwaway SQLite database — so it's fast and self-contained.
  # A red test here fails the workflow.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      # OpenSO.Tests.slnx is the lean dependency closure of the test project (server API + database +
      # their refs) — not the game client — so this builds only what the tests need.
      - name: Run .NET verification tests
        run: dotnet test TSOClient/OpenSO.Tests.slnx -c Release
      - name: Run manifest-generator tests
        run: python3 .github/scripts/test_gen_manifest.py

  # Compile the effect shaders fresh from source on Windows (the only OS where MonoGame's effect compiler
  # works — it needs Wine on linux/osx). Produces both Content/DX (Windows client) and Content/OGL (DesktopGL
  # clients); the per-platform build-client jobs download the matching set so no client ships a stale .xnb.
  compile-shaders:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      # Shader compilation is deterministic in its inputs (the .fx sources, the compile script, and the
      # pinned mgcb tool version), so cache the compiled .xnb output keyed on exactly those. Most pushes
      # don't touch shaders — on a hit we skip the whole mgcb compile (the slowest part of this job).
      # NOTE: exact-key only, no restore-keys — a stale partial hit would defeat the "skip compile" check.
      - name: Cache compiled shaders
        id: shader-cache
        uses: actions/cache@v4
        with:
          path: |
            TSOClient/tso.content/Content/DX/Effects
            TSOClient/tso.content/Content/OGL/Effects
          key: shaders-${{ hashFiles('TSOClient/tso.content/ContentSrc/Effects/**', '.github/scripts/compile-shaders.sh', 'TSOClient/tso.content/.config/dotnet-tools.json') }}
      # The compile script's `dotnet tool restore` pulls the mgcb tool from NuGet — cache the package
      # store so that download is skipped too. Only needed when the shader cache misses.
      - name: Cache NuGet packages (mgcb tool)
        if: steps.shader-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-tools-${{ hashFiles('**/dotnet-tools.json') }}
      - name: Compile desktop shaders (DX + OGL)
        if: steps.shader-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash .github/scripts/compile-shaders.sh
      - uses: actions/upload-artifact@v4
        with:
          name: shaders-dx
          path: TSOClient/tso.content/Content/DX/Effects/
      - uses: actions/upload-artifact@v4
        with:
          name: shaders-ogl
          path: TSOClient/tso.content/Content/OGL/Effects/

  # Client: Windows = FSO.IDE (its output contains the full OpenSO.exe client); the other platforms =
  # FSO.Unix. macOS builds BOTH its RIDs in one job below (build-client-macos) — macOS runners have
  # the slowest queues and bill at 10x, so one runner cross-compiling both beats two queued runners.
  build-client:
    needs: [ compile-shaders ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, project: TSOClient/FSO.IDE,  rid: win-x64,   asset: OpenSO-client-win-x64 }
          - { os: ubuntu-latest,  project: TSOClient/FSO.Unix, rid: linux-x64, asset: OpenSO-client-linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      # Cache the NuGet package store so restore only downloads what changed. Keyed on every .csproj
      # (the repo doesn't use packages.lock.json, so setup-dotnet's built-in cache can't be used); the
      # restore-key falls back to the newest previous cache so a csproj edit still starts ~warm.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      # Overlay the freshly-compiled shaders (from the compile-shaders job) over the committed .xnb so the
      # published client carries shaders built from current source. DX for the Windows client, OGL otherwise.
      - name: Use freshly-compiled shaders
        uses: actions/download-artifact@v4
        with:
          name: shaders-${{ matrix.rid == 'win-x64' && 'dx' || 'ogl' }}
          path: TSOClient/tso.content/Content/${{ matrix.rid == 'win-x64' && 'DX' || 'OGL' }}/Effects
      # PublishReadyToRun=false: FSO.IDE opts into ReadyToRun in its csproj, which roughly triples the
      # Windows publish time for an AOT-precompile that only speeds up end-user startup. Per-push CI just
      # verifies the build compiles, so skip it here. release.yml keeps R2R on — shipped builds want it.
      - name: Publish client
        run: dotnet publish ${{ matrix.project }} -c Release -r ${{ matrix.rid }} --self-contained -p:PublishReadyToRun=false -o Artifacts/Client
      # Zip before upload: upload-artifact uploads file-by-file, and a self-contained publish is thousands
      # of loose files — one zip cuts the upload from minutes to seconds. (upload-artifact zips its content
      # anyway, so downloaders were always getting a zip; this just adds one inner layer.)
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          ( cd Artifacts/Client && zip -qr "../../dist/${{ matrix.asset }}.zip" . )
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path Artifacts/Client/* -DestinationPath "dist/${{ matrix.asset }}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  # Both macOS RIDs from ONE arm64 runner: osx-arm64 natively, osx-x64 cross-compiled (the SDK and
  # crossgen2 both support cross-arch targeting). Checkout + SDK + restore are paid once instead of
  # twice, and Intel Macs are on their way out anyway — arm64 is the primary target.
  build-client-macos:
    needs: [ compile-shaders ]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Use freshly-compiled shaders
        uses: actions/download-artifact@v4
        with:
          name: shaders-ogl
          path: TSOClient/tso.content/Content/OGL/Effects
      # See build-client: R2R off per-push (verification only); release.yml keeps it on.
      - name: Publish client (osx-x64 + osx-arm64)
        run: |
          mkdir -p dist
          for RID in osx-arm64 osx-x64; do
            dotnet publish TSOClient/FSO.Unix -c Release -r "$RID" --self-contained -p:PublishReadyToRun=false -o "Artifacts/Client-$RID"
            ( cd "Artifacts/Client-$RID" && zip -qr "../../dist/OpenSO-client-$RID.zip" . )
          done
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSO-client-osx-arm64
          path: dist/OpenSO-client-osx-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSO-client-osx-x64
          path: dist/OpenSO-client-osx-x64.zip

  # Server: FSO.Server.Core supports win-x64 + linux-x64 (linux-x64 is the docker/Hetzner deploy target).
  build-server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      # Same NuGet cache as build-client (no packages.lock.json in the repo, so actions/cache it is).
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      # PublishReadyToRun=false: same rationale as build-client — the csproj opts into R2R for
      # shipped builds (release.yml/docker), per-push CI only verifies compilation.
      - name: Publish server
        run: dotnet publish TSOClient/FSO.Server.Core -c Release -r ${{ matrix.rid }} --self-contained -p:PublishReadyToRun=false -o Artifacts/Server
      # Zip before upload — same rationale as build-client (thousands of loose self-contained files).
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          ( cd Artifacts/Server && zip -qr "../../dist/OpenSO-server-${{ matrix.rid }}.zip" . )
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path Artifacts/Server/* -DestinationPath "dist/OpenSO-server-${{ matrix.rid }}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSO-server-${{ matrix.rid }}
          path: dist/*
